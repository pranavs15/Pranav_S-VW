<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f9;
            text-align: center;
        }

        .container {
            width: 60%;
            margin: auto;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px gray;
        }

        a {
            text-decoration: none;
            color: white;
            background-color: #007bff;
            padding: 5px 10px;
            border-radius: 4px;
        }

        a:hover {
            background-color: #0056b3;
        }

        .cart-link {
            background-color: green;
        }
    </style>
</head>
<body>

<div class="container">
    <h2> Products</h2>

    {% for product, price in products.items() %}
        <div class="card">
            <h3>{{ product }}</h3>
            <p>Price: ₹{{ price }}</p>
            <a href="/products/add/{{ product }}">Add to Cart</a>
        </div>
    {% endfor %}

    <br>
    <a class="cart-link" href="/cart">Go to Cart</a>
</div>

</body>
</html>
