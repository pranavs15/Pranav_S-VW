<!DOCTYPE html>
<html>
<head>
    <title>Flask API + JS Example</title>
</head>
<body>

<h2>Open Console (F12) to See API Outputs</h2>

<!-- Promise Example -->
<script>
let promise = new Promise(function(resolve, reject) {
    let success = true;
    if(success){
        resolve("Operation success");
    } else {
        reject("Operation failed");
    }
});

promise.then(function(result){
    console.log("Promise Result:", result);
}).catch(function(err){
    console.log("Promise Error:", err);
});
</script>

<!-- Fetch API Example -->
<script>
fetch('http://localhost:5000/api/products', {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        name: "Tablet",
        price: 20000
    })
})
.then(resp => resp.json())
.then(data => console.log("Fetch POST Created:", data))
.catch(err => console.log("Fetch POST Error:", err));

async function fetchProducts() {
    try {
        let response = await fetch('http://localhost:5000/api/products');
        let data = await response.json();
        console.log("Fetch GET Products:", data);
    } catch(err) {
        console.log("Fetch GET Error:", err);
    }
}

fetchProducts();
</script>

<!-- Axios Library -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<!-- Axios API Example -->
<script>
axios.get('http://localhost:5000/api/products')
.then(resp => console.log("Axios GET Products:", resp.data))
.catch(err => console.log("Axios GET Error:", err));

axios.post('http://localhost:5000/api/products', {
    name: "Headphones",
    price: 2000
})
.then(resp => console.log("Axios POST Created:", resp.data))
.catch(err => console.log("Axios POST Error:", err));

async function getProductsWithAxios() {
    try {
        const response = await axios.get('http://localhost:5000/api/products');
        console.log("Async/Await Axios GET:", response.data);
    } catch(err) {
        console.log("Async/Await Axios Error:", err);
    }
}

getProductsWithAxios();
</script>

<!-- External API Example -->
<script>
async function futuramaAPI() {
    try {
        let response = await fetch("https://api.sampleapis.com/futurama/info");
        let data = await response.json();
        console.log("Futurama API Data:", data);
    } catch(err) {
        console.log("Futurama API Error:", err);
    }
}

futuramaAPI();
</script>

</body>
</html>
