<!DOCTYPE html>
<html>
<head>
    <title>Bulb On Off</title>
    <style>
        body {
            text-align: center;
            margin-top: 100px;
        }
    </style>
</head>
<body>

<h3>Bulb ON/OFF</h3>

<img id="bulb" src="https://www.w3schools.com/js/pic_bulboff.gif" width="150">

<br><br>

<button onclick="turnOn()">Turn ON</button>
<button onclick="turnOff()">Turn OFF</button>

<script>
function turnOn() {
    document.getElementById("bulb").src =
    "https://www.w3schools.com/js/pic_bulbon.gif";
}

function turnOff() {
    document.getElementById("bulb").src =
    "https://www.w3schools.com/js/pic_bulboff.gif";
}
</script>

</body>
</html>
